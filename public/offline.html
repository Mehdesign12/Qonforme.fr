<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <title>Hors connexion — Qonforme</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Page servie par le service worker quand le réseau est indisponible.
      Elle doit rester 100 % autonome : aucun CSS, script ou police externe,
      sinon elle échouerait elle aussi à s'afficher hors connexion.
      Pas de backdrop-filter ici — voir la règle iOS dans CLAUDE.md.
    -->
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --primary: #2563eb;
        --border: #e2e8f0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --card: #111c31;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --primary: #3b82f6;
          --border: #1e3a5f;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }

      .card {
        width: 100%;
        max-width: 26rem;
        padding: 2.5rem 1.75rem;
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        background: var(--card);
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      }

      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        display: block;
        border-radius: 1rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 1.75rem;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: var(--muted);
      }

      button {
        /* 48px : au-dessus de la cible tactile minimale de 44px recommandée par Apple. */
        min-height: 48px;
        width: 100%;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--primary);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      button:active {
        opacity: 0.85;
      }

      .status {
        margin: 1.25rem 0 0;
        font-size: 0.8125rem;
        color: var(--muted);
        min-height: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        class="logo"
        src="/web-app-manifest-192x192.png"
        alt="Qonforme"
        width="72"
        height="72"
      />
      <h1>Vous êtes hors connexion</h1>
      <p>
        Impossible de joindre Qonforme. Vos factures et devis sont en sécurité sur
        nos serveurs&nbsp;: reconnectez-vous à Internet pour y accéder à nouveau.
      </p>
      <button type="button" id="retry">Réessayer</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      (function () {
        var status = document.getElementById('status')
        var retry = document.getElementById('retry')

        function reload() {
          // `location.reload()` rejouerait cette même page depuis le cache :
          // on repart de l'URL demandée pour laisser le service worker retenter le réseau.
          window.location.replace(
            document.referrer && new URL(document.referrer).origin === window.location.origin
              ? document.referrer
              : '/dashboard',
          )
        }

        retry.addEventListener('click', function () {
          if (navigator.onLine) {
            status.textContent = 'Reconnexion…'
            reload()
          } else {
            status.textContent = 'Toujours hors connexion. Vérifiez votre réseau.'
          }
        })

        // Reprise automatique dès que le réseau revient.
        window.addEventListener('online', function () {
          status.textContent = 'Connexion rétablie, chargement…'
          reload()
        })
      })()
    </script>
  </body>
</html>
