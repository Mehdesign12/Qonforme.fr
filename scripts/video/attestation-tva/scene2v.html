<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vidéo : attestation de TVA (v2, rythmée)</title>
<style>
  @font-face { font-family: "Bricolage"; src: url("/repo/lib/blog-images/cover/fonts/BricolageGrotesque-700.woff") format("woff"); font-weight: 700; }
  @font-face { font-family: "Instrument"; src: url("/repo/lib/blog-images/cover/fonts/InstrumentSerif-Italic.woff") format("woff"); font-style: italic; }
  @font-face { font-family: "DM"; src: url("/fonts/dm-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "DM"; src: url("/fonts/dm-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "DM"; src: url("/fonts/dm-600.woff2") format("woff2"); font-weight: 600; }
  :root { --ink:#0F172A; --ink2:#0A1122; --accent:#2563EB; --accent2:#1D4ED8; --wash:#EEF3FF; --wash2:#DCE6FD; --line:#E6E9F0; --t2:#334155; --t3:#475569; --t4:#64748B; --grey:#A8B2C3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
  body { font-family: "DM", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
  .grid { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed #E9EDF4; }
  .scene { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .h { font-family: "Bricolage", sans-serif; font-weight: 700; letter-spacing: -0.035em; line-height: 1.03; color: var(--ink2); }
  .serif { font-family: "Instrument", serif; font-style: italic; font-weight: 400; color: var(--accent); letter-spacing: -0.01em; }
  .w { display: inline-block; white-space: pre; }
  .pill { display: inline-flex; align-items: center; gap: 12px; height: 64px; padding: 0 28px; border-radius: 999px; border: 2px solid var(--line); background: #fff; font-size: 28px; font-weight: 600; color: var(--t2); white-space: nowrap; }
  .pill.blue { background: var(--wash); border-color: var(--wash2); color: var(--accent2); }
  .pill.solid { background: var(--accent); border-color: var(--accent2); color: #fff; }
  .paper { position: absolute; background: #fff; border: 2px solid var(--line); border-radius: 24px; box-shadow: 0 34px 70px -30px rgba(10,17,34,.34), 0 2px 6px rgba(10,17,34,.04); }
  .bar { position: absolute; height: 14px; border-radius: 7px; background: #E9EDF3; }
  .ic { display: inline-block; flex-shrink: 0; }
  .ic svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .src { position: absolute; left: 80px; top: 138px; max-width: 920px; text-align: left; font-size: 24px; color: var(--t4); font-weight: 500; }
  #logo { position: absolute; left: 80px; top: 70px; height: 50px; }
  #progress { position: absolute; left: 0; top: 0; height: 10px; width: 1080px; background: var(--accent); transform-origin: left; }
  .row { position: absolute; display: flex; align-items: center; gap: 28px; }
  .cap { position: absolute; left: 80px; right: 80px; top: 1420px; height: 190px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 60px; font-weight: 600; line-height: 1.15; }
  .cap .cw { display: inline-block; white-space: pre; color: var(--grey); }
</style>
</head>
<body>
<div id="stage">
  <div class="grid" style="left:80px"></div><div class="grid" style="left:1000px"></div>
  <div id="progress"></div>
  <img id="logo" src="/repo/lib/blog-images/cover/logo-long-bleu.png" alt="">
</div>
<script>
const D = window.__DATA
const stage = document.getElementById('stage')
const NS = 'http://www.w3.org/2000/svg'
let T0 = 0, CUR = null
const SPRING = 'cubic-bezier(.34,1.56,.64,1)', EASE = 'cubic-bezier(.2,.8,.2,1)'

function el(tag, cls, parent, html, style) {
  const e = document.createElement(tag); if (cls) e.className = cls
  if (html != null) e.innerHTML = html; if (style) Object.assign(e.style, style)
  if (parent) parent.appendChild(e); return e
}
function icon(name, size, color, stroke) {
  const s = el('span', 'ic', null, '<svg viewBox="0 0 24 24" stroke-width="' + (stroke || 1.7) + '">' + (D.icons[name] || '') + '</svg>')
  s.style.width = s.style.height = size + 'px'; if (color) s.style.color = color; return s
}
function anim(e, kf, at, dur, easing, fill) {
  const a = e.animate(kf, { delay: (T0 + at) * 1000, duration: Math.max(dur, 0.001) * 1000, fill: fill || 'both', easing: easing || EASE })
  a.pause(); return a
}
/* instant d'un mot prononcé (secondes depuis le début de la scène) */
function W(re, fallback) {
  const ws = D.words[CUR] || []; let pos = 0; const starts = []
  const joined = ws.map(function (w) { starts.push(pos); const s = w.w; pos += s.length + 1; return s }).join(' ')
  const m = joined.match(re); if (!m) return fallback == null ? 0.5 : fallback
  let i = 0; while (i + 1 < starts.length && starts[i + 1] <= m.index) i++
  return ws[i].t
}
function WE(re, fallback) {   // fin du mot
  const ws = D.words[CUR] || []; const t = W(re, fallback)
  const w = ws.find(function (x) { return x.t === t }); return w ? w.t + w.d : t + 0.3
}
/* entrées */
function pop(e, at, o) { o = o || {}
  anim(e, [{ opacity: 0, transform: 'translate(' + (o.x || 0) + 'px,' + (o.y == null ? 50 : o.y) + 'px) scale(' + (o.s || .6) + ') rotate(' + (o.r || 0) + 'deg)' }, { opacity: 1, transform: o.r ? 'rotate(' + o.r + 'deg)' : 'none' }], at, o.d || 0.55, SPRING) }
function fade(e, at, d) { anim(e, [{ opacity: 0 }, { opacity: 1 }], at, d || 0.3, 'linear') }
function gone(e, at, d) { anim(e, [{ opacity: 1 }, { opacity: 0 }], at, d || 0.25, 'linear') }
function bump(e, at) { anim(e, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], at, 0.45, EASE, 'none') }
function float(e, amp, period, phase) { const a = e.animate([{ translate: '0 0' }, { translate: '0 ' + (-amp) + 'px' }, { translate: '0 0' }], { duration: period * 1000, iterations: Infinity, delay: (T0 + (phase || 0)) * 1000, easing: 'ease-in-out', fill: 'both' }); a.pause() }
function kinetic(parent, parts, at, step) {   // titre : chaque mot jaillit
  let i = 0
  parts.forEach(function (p) {
    const line = el('div', null, parent)
    p.t.split(' ').forEach(function (w, k, arr) {
      const s = el('span', 'w' + (p.serif ? ' serif' : ''), line, w + (k < arr.length - 1 ? ' ' : ''))
      if (p.serif) s.style.fontSize = '1.12em'
      anim(s, [{ opacity: 0, transform: 'translateY(70px) scale(.82) rotate(2deg)' }, { opacity: 1, transform: 'none' }], at + i * step, 0.55, SPRING); i++
    })
  })
}
function strike(parent, x, y, w, at, color) {
  const l = el('div', null, parent, null, { position: 'absolute', left: x + 'px', top: y + 'px', width: w + 'px', height: '10px', borderRadius: '5px', background: color || 'var(--ink2)', transformOrigin: 'left', transform: 'rotate(-3deg)' })
  anim(l, [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], at, 0.35); return l
}
function check(parent, x, y, size, at) {
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 24 24')
  svg.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + size + 'px;height:' + size + 'px;overflow:visible'
  const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', 12); c.setAttribute('cy', 12); c.setAttribute('r', 11); c.setAttribute('fill', '#2563EB')
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', 'M6.5 12.5l3.5 3.5 7.5-8'); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#fff'); p.setAttribute('stroke-width', '2.4'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); p.setAttribute('pathLength', '1'); p.style.strokeDasharray = '1'
  svg.appendChild(c); svg.appendChild(p); parent.appendChild(svg)
  anim(c, [{ transform: 'scale(0)' }, { transform: 'scale(1)' }], at, 0.35, SPRING); c.style.transformOrigin = '12px 12px'
  anim(p, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], at + 0.15, 0.3)
}
function sign(parent, x, y, w, at, d) {
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 200 60'); svg.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;overflow:visible'
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', 'M4 40 C 20 8, 34 8, 30 34 C 28 52, 44 14, 54 30 C 62 44, 70 22, 82 28 C 96 36, 100 12, 116 26 C 130 38, 142 20, 168 30 L 196 24')
  p.setAttribute('pathLength', '1'); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#0F172A'); p.setAttribute('stroke-width', '3.2'); p.setAttribute('stroke-linecap', 'round'); p.style.strokeDasharray = '1'
  svg.appendChild(p); parent.appendChild(svg); anim(p, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], at, d, 'ease-in-out')
}
function typewriter(parent, text, at, total) {
  const per = total / Math.max(text.length, 1)
  text.split('').forEach(function (c, i) { const s = el('span', null, parent, c); anim(s, [{ opacity: 0 }, { opacity: 1 }], at + i * per, 0.01, 'linear') })
}
function paper(root, x, y, w, h, at, o) {
  const p = el('div', 'paper', root, null, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' })
  el('div', 'bar', p, null, { left: '40px', top: '42px', width: '160px', height: '22px', background: '#DCE6FD' })
  el('div', 'bar', p, null, { right: '40px', top: '46px', width: '120px' })
  el('div', 'bar', p, null, { left: '40px', top: '104px', width: (w * .5) + 'px' })
  el('div', 'bar', p, null, { left: '40px', top: '136px', width: (w * .36) + 'px' })
  for (let i = 0; i < 3; i++) { el('div', 'bar', p, null, { left: '40px', top: (200 + i * 40) + 'px', width: (w * .5) + 'px', height: '11px' }); el('div', 'bar', p, null, { right: '40px', top: (200 + i * 40) + 'px', width: '110px', height: '11px' }) }
  pop(p, at, { y: 80, s: .85, r: (o && o.r) || 0 }); return p
}
function scene(id, build) {
  const s = D.scenes.find(function (x) { return x.id === id }); T0 = s.t0; CUR = id
  const root = el('div', 'scene', stage); root.dataset.t0 = s.t0; root.dataset.t1 = s.t0 + s.dur
  anim(root, [{ opacity: 0, transform: 'translateX(60px)' }, { opacity: 1, transform: 'none' }], 0, 0.4, EASE, 'backwards')
  anim(root, [{ opacity: 1 }, { opacity: 0 }], s.dur - 0.3, 0.3, 'linear', 'forwards')
  const cam = el('div', null, root, null, { position: 'absolute', inset: '0', transformOrigin: '50% 45%' })
  anim(cam, [{ transform: 'scale(1)' }, { transform: 'scale(1.035)' }], 0, s.dur, 'linear')
  build(cam, s.dur); caption(root, id, s.dur)
  if (D.src[id]) { const e = el('div', 'src', root, D.src[id]); pop(e, 0.7, { y: -20, s: 1 }) }
}
/* sous-titres au rythme de la voix : le mot dit s'allume en bleu et « saute » */
function caption(root, id, dur) {
  const ws = D.words[id] || []; const text = (D.texts && D.texts[id]) || ''; const chunks = []; let cur = [], pos = 0
  ws.forEach(function (w, i) {
    const at = text.indexOf(w.w, pos); let after = ''
    if (at >= 0) { pos = at + w.w.length; after = text.slice(pos, pos + 2) }
    cur.push(w)
    const end = /^[.?!»]/.test(after.trim()) || /^[:;]/.test(after.trim()), comma = /^,/.test(after.trim())
    if (end || (comma && cur.length >= 4) || cur.length >= 5 || i === ws.length - 1) { chunks.push(cur); cur = [] }
  })
  chunks.forEach(function (ch, ci) {
    const t0 = Math.max(ch[0].t - 0.12, 0), t1 = (chunks[ci + 1] ? chunks[ci + 1][0].t - 0.14 : ch[ch.length - 1].t + ch[ch.length - 1].d + 0.5)
    const box = el('div', 'cap', root); const inner = el('div', null, box)
    anim(box, [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], t0, 0.16, EASE, 'backwards')
    anim(box, [{ opacity: 1 }, { opacity: 0 }], Math.max(t1, t0 + .2), 0.12, 'linear', 'forwards')
    ch.forEach(function (w, wi) {
      const s = el('span', 'cw', inner, w.w); if (wi < ch.length - 1) inner.appendChild(document.createTextNode(' '))
      anim(s, [{ color: '#A8B2C3', transform: 'scale(1)' }, { color: '#2563EB', transform: 'translateY(-6px)', offset: .35 }, { color: '#0F172A', transform: 'scale(1)' }], w.t, Math.max(w.d + 0.18, 0.3), EASE)
    })
  })
}


/* ───────── 1 · accroche ───────── */
scene('s1', function (r, dur) {
  const pill = el('div', 'pill blue abs', r, null, { left: '80px', top: '230px' }); pill.appendChild(icon('house', 34, 'var(--accent2)')); pill.appendChild(document.createTextNode('TVA des travaux')); pop(pill, 0.15)
  const t = el('div', 'h abs', r, null, { left: '80px', top: '330px', fontSize: '112px', width: '930px' })
  kinetic(t, [{ t: "Fini l'attestation" }, { t: 'de TVA' }, { t: 'à faire signer.', serif: true }], 0.25, 0.14)
  const tk = W(/obligatoire/, 3.2)
  strike(r, 76, 436, 800, tk, 'var(--accent)')
  const papier = paper(r, 250, 800, 580, 560, 0.15, { r: 5 }); papier.style.transform = 'rotate(5deg)'
  el('div', null, papier, 'ATTESTATION', { position: 'absolute', left: '44px', top: '52px', fontSize: '30px', fontWeight: '600', letterSpacing: '.14em', color: 'var(--t3)' })
  const cross = document.createElementNS(NS, 'svg'); cross.setAttribute('viewBox', '0 0 100 100'); cross.style.cssText = 'position:absolute;left:100px;top:150px;width:380px;height:380px;overflow:visible'
  const l1 = document.createElementNS(NS, 'path'); l1.setAttribute('d', 'M14 14 L86 86'); const l2 = document.createElementNS(NS, 'path'); l2.setAttribute('d', 'M86 14 L14 86')
  ;[l1, l2].forEach(function (l, i) { l.setAttribute('stroke', '#2563EB'); l.setAttribute('stroke-width', '9'); l.setAttribute('stroke-linecap', 'round'); l.setAttribute('pathLength', '1'); l.style.strokeDasharray = '1'; cross.appendChild(l); anim(l, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], tk + .1 + i * .18, 0.25) })
  papier.appendChild(cross)
  anim(papier, [{ transform: 'rotate(5deg) translate(0,0)' }, { transform: 'rotate(2deg) translate(-8px,0)', offset: .2 }, { transform: 'rotate(8deg) translate(10px,0)', offset: .4 }, { transform: 'rotate(5deg)' }], tk + .25, 0.5, 'linear', 'none')
  const tf = W(/à la place/, 5.5)
  anim(papier, [{ transform: 'rotate(5deg)', opacity: 1 }, { transform: 'translate(700px,-500px) rotate(40deg)', opacity: 0 }], tf - 0.4, 0.6, 'cubic-bezier(.6,0,.9,.4)', 'forwards')
  const ph = el('div', 'abs', r, null, { left: '140px', top: '700px', width: '800px', height: '660px', borderRadius: '400px 400px 40px 40px', overflow: 'hidden', background: '#EEF3FF' })
  const img = el('img', null, ph, null, { width: '100%', height: '100%', objectFit: 'cover', objectPosition: '38% 50%' }); img.src = D.assets.photoClient
  anim(ph, [{ clipPath: 'inset(100% 0 0 0)', opacity: 1 }, { clipPath: 'inset(0 0 0 0)', opacity: 1 }], tf, 0.8, EASE, 'both'); ph.style.opacity = 1
  anim(img, [{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], tf, dur - tf)
})

/* ───────── 2 · avant ───────── */
scene('s2', function (r, dur) {
  const pill = el('div', 'pill abs', r, 'Avant', { left: '80px', top: '230px' }); pop(pill, 0.1)
  const t = el('div', 'h abs', r, null, { left: '80px', top: '330px', fontSize: '108px', width: '930px' })
  kinetic(t, [{ t: 'Un papier de plus' }, { t: 'à remplir.', serif: true }], 0.15, 0.14)
  const p = el('div', 'paper', r, null, { left: '300px', top: '680px', width: '520px', height: '440px', transform: 'rotate(-3deg)' })
  pop(p, 0.2, { y: 90, s: .85, r: -3 })
  el('div', null, p, 'Taux réduit de TVA · travaux', { position: 'absolute', left: '36px', top: '36px', fontSize: '25px', fontWeight: '600', color: 'var(--t3)' })
  for (let i = 0; i < 4; i++) el('div', 'bar', p, null, { left: '36px', top: (96 + i * 38) + 'px', width: (i % 3 === 2 ? 280 : 440) + 'px', height: '12px' })
  const c1 = el('div', 'pill', p, '1300-SD', { position: 'absolute', left: '36px', top: '270px', height: '52px', fontSize: '25px' }); pop(c1, W(/trois cents/, 1.2), { y: 20, s: .6, d: .45 })
  const c2 = el('div', 'pill blue', p, '1301-SD', { position: 'absolute', left: '190px', top: '270px', height: '52px', fontSize: '25px' }); pop(c2, W(/trois cent un/, 2.6), { y: 20, s: .6, d: .45 })
  sign(p, 250, 350, 200, W(/signer/, 4.8), 0.9)
  const steps = [['file-pen', 'À remplir', /remplir/], ['pen-line', 'À signer', /signer/], ['archive', 'À classer', /classer/]]
  steps.forEach(function (s, i) {
    const c = el('div', 'pill', r, null, { position: 'absolute', left: (80 + i * 312) + 'px', top: '1170px', height: '84px', padding: '0 24px', fontSize: '31px', gap: '12px' })
    c.appendChild(icon(s[0], 40, 'var(--accent)', 1.6)); c.appendChild(document.createTextNode(s[1])); pop(c, W(s[2], 3.5 + i * .8), { y: 60, s: .7 })
  })
  const ok = el('div', 'pill solid', r, null, { position: 'absolute', left: '80px', top: '1290px', height: '78px', fontSize: '28px' }); ok.appendChild(icon('circle-check', 34, '#fff', 1.8)); ok.appendChild(document.createTextNode('1301-SD : toujours accepté s’il est complet'))
  pop(ok, W(/accepté/, 8.5), { y: 40, s: .8 }); bump(ok, W(/complet/, 9.5))
})

/* ───────── 3 · maintenant ───────── */
scene('s3', function (r, dur) {
  const pill = el('div', 'pill solid abs', r, null, { left: '80px', top: '230px' }); pill.appendChild(icon('calendar', 34, '#fff')); pill.appendChild(document.createTextNode('Depuis 2025')); pop(pill, 0.1)
  const t = el('div', 'h abs', r, null, { left: '80px', top: '330px', fontSize: '108px', width: '930px' })
  kinetic(t, [{ t: 'Le client certifie' }, { t: 'sur le devis.', serif: true }], 0.15, 0.14)
  const tc = W(/certifie/, 1)
  const mk = function (x, y, label, at, rot) {
    const p = paper(r, x, y, 470, 500, at, { r: rot }); p.style.transform = rot ? 'rotate(' + rot + 'deg)' : ''
    el('div', 'pill blue', p, label, { position: 'absolute', left: '36px', top: '-32px', height: '56px', fontSize: '26px' })
    const box = el('div', null, p, null, { position: 'absolute', left: '28px', right: '28px', top: '300px', height: '150px', borderRadius: '16px', background: 'var(--wash)', border: '2px solid var(--wash2)' })
    box.appendChild(icon('file-check', 54, 'var(--accent2)', 1.5)).style.cssText += ';position:absolute;left:22px;top:22px'
    ;[240, 260, 170].forEach(function (w, i) { el('div', 'bar', box, null, { left: '90px', top: (34 + i * 34) + 'px', width: w + 'px', background: '#C4D4FA' }) })
    anim(box, [{ opacity: 0, transform: 'translateY(-120px) scale(.9)' }, { opacity: 1, transform: 'none' }], at + 0.2, 0.6, SPRING)
    return p
  }
  const pd = mk(80, 720, 'Devis', Math.max(tc - .1, .4), -2)
  const pf = mk(520, 800, 'Facture', W(/facture/, 4.2), 2)
  const ring = el('div', null, r, null, { position: 'absolute', left: '100px', top: '1000px', width: '430px', height: '160px', borderRadius: '20px', border: '4px solid var(--accent)', opacity: 0 })
  anim(ring, [{ opacity: 0, transform: 'scale(1)' }, { opacity: .9, transform: 'scale(1.05)', offset: .3 }, { opacity: 0, transform: 'scale(1.18)' }], tc + .75, 0.8, EASE, 'both')
  const ex = el('div', 'pill', r, null, { position: 'absolute', left: '80px', top: '1320px', height: '72px', fontSize: '26px', gap: '14px', padding: '0 22px' }); ex.appendChild(icon('calendar', 34, 'var(--accent)', 1.7)); ex.appendChild(document.createTextNode('Exception : travaux en cours au 16 février 2025'))
  pop(ex, W(/exception/i, 7.5), { y: 50, s: .8 }); bump(ex, W(/16/, 8.4))
  float(pd, 6, 3.2, 0); float(pf, 8, 3.8, 1)
})

/* ───────── 4 · conditions ───────── */
scene('s4', function (r, dur) {
  const t = el('div', 'h abs', r, null, { left: '80px', top: '260px', fontSize: '112px', width: '930px' })
  kinetic(t, [{ t: 'Les conditions' }, { t: 'à réunir.', serif: true }], 0.15, 0.14)
  const items = [['house', "Logement à usage d'habitation", W(/habitation/, 2.2)], ['calendar', 'Achevé depuis plus de deux ans', W(/plus de deux/, 4.6)], ['building-2', 'Ni neuf, ni +10 % de surface', W(/neuf/, 6.4)]]
  items.forEach(function (it, i) {
    const row = el('div', 'row', r, null, { left: '80px', top: (600 + i * 125) + 'px', width: '800px' }); row.appendChild(icon(it[0], 64, 'var(--accent)', 1.5))
    el('div', null, row, it[1], { fontSize: '40px', fontWeight: '600', color: 'var(--ink)', maxWidth: '700px', lineHeight: '1.15' }); pop(row, it[2] - .15, { x: -80, y: 0, s: .9 })
    check(r, 920, 600 + i * 125 + 2, 64, it[2] + .45)
  })
  const card = function (rate, line, at, x, strong) {
