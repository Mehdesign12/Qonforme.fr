<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:"Bricolage";src:url("/repo/lib/blog-images/cover/fonts/BricolageGrotesque-700.woff") format("woff");font-weight:700}
@font-face{font-family:"Instrument";src:url("/repo/lib/blog-images/cover/fonts/InstrumentSerif-Italic.woff") format("woff");font-style:italic}
@font-face{font-family:"DM";src:url("/fonts/dm-600.woff2") format("woff2");font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;background:#fff;font-family:"DM",sans-serif;position:relative}
.grid{position:absolute;top:0;bottom:0;border-left:2px dashed #E9EDF4}
.h{font-family:"Bricolage",sans-serif;font-weight:700;letter-spacing:-.04em;line-height:.98;color:#0A1122;position:absolute;left:70px;top:120px;font-size:136px;width:760px}
.s{font-family:"Instrument",serif;font-style:italic;font-weight:400;color:#2563EB;letter-spacing:-.01em;font-size:1.12em}
.chip{position:absolute;left:70px;display:inline-flex;align-items:center;height:64px;padding:0 30px;border-radius:999px;font-size:32px;font-weight:600;white-space:nowrap}
.photo{position:absolute;left:830px;top:50px;width:420px;height:620px;border-radius:210px 210px 30px 30px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(10,17,34,.4)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:38% 50%}
.paper{position:absolute;left:700px;top:360px;width:300px;height:340px;background:#fff;border:3px solid #E6E9F0;border-radius:22px;box-shadow:0 30px 60px -28px rgba(10,17,34,.45);transform:rotate(-7deg)}
.bar{position:absolute;left:28px;height:12px;border-radius:6px;background:#E9EDF3}
#logo{position:absolute;left:70px;top:44px;height:44px}
</style></head><body>
<div class="grid" style="left:70px"></div><div class="grid" style="left:830px"></div>

<div class="h">L'attestation de TVA ?<br><span class="s">C'est fini.</span></div>
<div class="chip" style="top:560px;background:#2563EB;color:#fff">Voici quoi écrire à la place</div>
<div class="photo"><img src="/public/landing/photos/artisan-client.webp"></div>
<div class="paper"><div style="position:absolute;left:28px;top:26px;font-size:20px;font-weight:600;letter-spacing:.14em;color:#475569">ATTESTATION</div>
<div class="bar" style="top:80px;width:240px"></div><div class="bar" style="top:112px;width:200px"></div><div class="bar" style="top:144px;width:240px"></div><div class="bar" style="top:176px;width:150px"></div>
<svg viewBox="0 0 100 100" style="position:absolute;left:30px;top:90px;width:250px;height:250px"><path d="M14 14L86 86M86 14L14 86" stroke="#2563EB" stroke-width="10" stroke-linecap="round" fill="none"/></svg></div>
<div class="chip" style="left:520px;top:50px;height:56px;font-size:28px;background:#EEF3FF;color:#1D4ED8;border:2px solid #DCE6FD;display:none">TVA 10 %</div>
</body></html>
