<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Connexion impossible — Qonforme</title>
    <!--
      Page de repli native (server.errorPath dans capacitor.config.ts).
      Affichée quand la WKWebView ne parvient pas à joindre qonforme.fr.
      Doit rester autonome : elle s'affiche justement quand le réseau manque.
    -->
    <style>
      :root { --bg:#f8fafc; --card:#fff; --fg:#0f172a; --muted:#64748b; --primary:#2563eb; --border:#e2e8f0; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0b1220; --card:#111c31; --fg:#e2e8f0; --muted:#94a3b8; --primary:#3b82f6; --border:#1e3a5f; }
      }
      * { box-sizing: border-box; }
      html, body { margin:0; height:100%; }
      body {
        display:flex; align-items:center; justify-content:center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
        background:var(--bg); color:var(--fg); text-align:center;
        font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing:antialiased;
      }
      .card {
        width:100%; max-width:24rem; padding:2.5rem 1.75rem;
        background:var(--card); border:1px solid var(--border);
        border-radius:1.25rem; box-shadow:0 12px 40px rgba(15,23,42,.08);
      }
      img { width:72px; height:72px; border-radius:1rem; display:block; margin:0 auto 1.5rem; }
      h1 { margin:0 0 .75rem; font-size:1.375rem; font-weight:700; letter-spacing:-.02em; }
      p  { margin:0 0 1.75rem; font-size:.9375rem; line-height:1.6; color:var(--muted); }
      button {
        min-height:48px; width:100%; padding:0 1.5rem; border:0; border-radius:.75rem;
        background:var(--primary); color:#fff; font:600 1rem inherit; font-family:inherit;
        -webkit-tap-highlight-color:transparent;
      }
      button:active { opacity:.85; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="logo.png" alt="Qonforme" width="72" height="72" />
      <h1>Connexion impossible</h1>
      <p>Qonforme n'arrive pas à joindre ses serveurs. Vérifiez votre connexion Internet, puis réessayez.</p>
      <button type="button" onclick="location.replace('https://qonforme.fr/dashboard')">Réessayer</button>
    </main>
  </body>
</html>
